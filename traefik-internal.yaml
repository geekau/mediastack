#########################################################################
#########################################################################
#
# Filename: internal.yaml        Traefik Internal Web Services Configuration File
#
# Replace all "example.com" values with your domain name
#
#  i.e.   - main: example.com
#           sans:
#             - "*.example.com"
#
#########################################################################
#########################################################################

http:
  routers:
    synology:                                # Synology DSM
      rule: "Host(`synology.example.com`)"
      service: synology
      entryPoints:
        - secureweb
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forwardauth@file
        - security-headers@file
        - traefik-bouncer@file

    gateway:                                 # Ubiquiti Dream Machine
      rule: "Host(`gateway.example.com`)"
      service: gateway
      entryPoints:
        - secureweb
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forwardauth@file
        - security-headers@file
        - traefik-bouncer@file

  services:
    synology:
      loadBalancer:
        servers:
          - url: "https://192.168.1.12:5001"   # Synology Web UI - HTTP (Insecure)
        passHostHeader: true
        serversTransport: insecure-no-verify          

    gateway:
      loadBalancer:
        servers:
          - url: "https://192.168.1.1"        # Ubiquiti Web UI - HTTPS
        passHostHeader: true
        serversTransport: insecure-no-verify

  serversTransports:
    insecure-no-verify:
      insecureSkipVerify: true
